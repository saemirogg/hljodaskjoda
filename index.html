<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hljóðaskjóða</title>
<meta name="description" content="Hljóðaskjóða: leikur í talþjálfun fyrir börn 4–9 ára. Bag of Sounds: an articulation practice game.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2322305c'/%3E%3Cpath d='M17 27c0-6 4-9 10-9h10c6 0 10 3 10 9v20c0 5-3 8-8 8H25c-5 0-8-3-8-8z' fill='%23fff'/%3E%3C/svg%3E">
<style>body{margin:0}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: a setup page that scrolls, and a one-screen play board. Sidebar of piece trays on the left, a square grid
   that always fits the remaining space on the right. Stacks to one column on narrow screens. */
:root{
  --font-display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --bg:#eceff6; --surface:#ffffff; --surface-2:#f3f5fa; --ink:#18213a; --ink-2:#56607a; --line:#d5dae8;
  --btn:#18213a; --btn-ink:#ffffff; --focus:#1d64b8;
  --c-initial:#c64a0b; --c-medial:#1d64b8; --c-final:#8a3fb0; --on-c:#ffffff;
  --cell:#ffffff; --logo-tile:#22305c;
  --shadow:0 1px 2px rgba(24,33,58,.08),0 8px 22px rgba(24,33,58,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151f; --surface:#1a2030; --surface-2:#222a3d; --ink:#eef1f8; --ink-2:#a4adc4; --line:#333c54;
  --btn:#eef1f8; --btn-ink:#11151f; --focus:#7db4f5;
  --c-initial:#f2813d; --c-medial:#5aa9f0; --c-final:#c58be6; --on-c:#10141c;
  --cell:#f6f7fb; --logo-tile:#2d3d73; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151f; --surface:#1a2030; --surface-2:#222a3d; --ink:#eef1f8; --ink-2:#a4adc4; --line:#333c54;
  --btn:#eef1f8; --btn-ink:#11151f; --focus:#7db4f5;
  --c-initial:#f2813d; --c-medial:#5aa9f0; --c-final:#c58be6; --on-c:#10141c;
  --cell:#f6f7fb; --logo-tile:#2d3d73; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#sprite{position:absolute;width:0;height:0;overflow:hidden}

/* position colours: colour + pattern so they stay distinct without colour vision */
[data-k="initial"]{--c:var(--c-initial);--pat:none}
[data-k="medial"]{--c:var(--c-medial);--pat:repeating-linear-gradient(135deg,rgba(255,255,255,.42) 0 2.5px,transparent 2.5px 7px)}
[data-k="final"]{--c:var(--c-final);--pat:radial-gradient(circle,rgba(255,255,255,.55) 1.4px,transparent 1.9px) 0 0/7px 7px}

.screen{height:100%;display:flex;flex-direction:column;min-width:0}
#setup{overflow:auto}
.bar{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.logo{width:48px;height:48px;flex:none}
.brand h1,.brand h2{font:600 26px/1.05 var(--font-display);margin:0;letter-spacing:.2px}
.brand small{display:block;color:var(--ink-2);font-size:13px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.lang button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

.btn{border:0;border-radius:12px;padding:10px 18px;background:var(--btn);color:var(--btn-ink);font-weight:700;min-height:44px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 14px;min-height:36px;font-size:14px}

.wrap{width:100%;max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:24px}
.top-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3,.label{font:600 14px/1.2 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;display:block}
.sound-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#sound{width:120px;font:600 44px/1 var(--font-display);text-align:center;padding:8px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;background:var(--c);color:var(--on-c);font:600 18px/1 var(--font-display);padding:6px 14px;border-radius:999px;min-width:3.2em;text-align:center}
.hint{color:var(--ink-2);font-size:14px;margin:10px 0 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 14px;font-weight:700;min-height:40px;font-variant-numeric:tabular-nums}
.seg button[aria-checked="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--focus);flex:none}
.check b{display:block}
.check small{color:var(--ink-2)}

.cats-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cats-head p{margin:0;color:var(--ink-2);font-size:14px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cat{background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cat header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cat .pos{font-size:14px;color:var(--ink-2)}
.cat .count{margin-left:auto;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px}
.pic-tile{width:56px;height:56px;border-radius:12px;border:0;background:var(--cell);padding:4px;flex:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.pic{width:100%;height:100%;display:block}
.word{flex:1;min-width:0;border:0;border-bottom:2px solid var(--line);background:none;padding:6px 2px;font-size:17px;font-weight:700}
.word:focus{border-bottom-color:var(--focus);outline:none}
.icon-btn{border:0;background:none;width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.add{border:2px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:none;border-radius:14px;padding:12px;font-weight:700;color:var(--ink);min-height:56px}
.add:hover{background:var(--surface)}
.credits{color:var(--ink-2);font-size:13px;margin:0}
.credits a{color:inherit}

.startbar{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;gap:14px;justify-content:flex-end;flex-wrap:wrap;padding-block:12px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.startbar .sum{color:var(--ink-2);margin-right:auto;font-size:15px}
.startbar .btn{font-size:18px;padding:12px 28px}

/* play */
#play{overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#play .logo{width:36px;height:36px}
.bar .chips .chip{font-size:15px;padding:4px 12px;min-width:2.8em}
.play{display:grid;grid-template-columns:minmax(250px,290px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px;flex:1;min-height:0;padding-bottom:16px}
#side{overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0;padding-right:2px}
.howto{margin:0;font-size:14px;color:var(--ink-2)}
.tray{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;flex:none;border:2px solid transparent;transition:border-color .15s}
.tray.armed{border-color:var(--c)}
.tray header{display:flex;align-items:center;gap:8px}
.tray .left{margin-left:auto;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.words{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.words li{display:flex;align-items:center;gap:10px;font-weight:700}
.words .pic{width:34px;height:34px;flex:none;background:var(--cell);border-radius:50%;padding:3px;box-shadow:inset 0 0 0 1.5px var(--line)}
.pieces{display:flex;flex-wrap:wrap;gap:5px}
.piece{width:32px;height:32px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 70%,#000);background:var(--pat),color-mix(in srgb,var(--c) 82%,transparent);
  color:var(--on-c);font:600 11px/1 var(--font-display);display:grid;place-items:center;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.piece span{background:color-mix(in srgb,var(--c) 85%,transparent);border-radius:6px;padding:1px 2px}
.piece.used{opacity:.18;pointer-events:none}
.piece[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--c)}
#ghost{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;z-index:50;opacity:.9;transform:translate(var(--x,0),var(--y,0))}
#ghost.piece{width:44px;height:44px}

#stage{container-type:size;min-width:0;min-height:0;display:grid;place-items:center;position:relative}
#grid{--n:10;width:min(100cqw,100cqh);aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:calc(min(100cqw,100cqh)*.07/var(--n))}
.cell{position:relative;border-radius:50%;border:0;background:var(--cell);padding:11%;min-width:0;min-height:0;box-shadow:inset 0 0 0 max(1.5px,.5cqmin) var(--line)}
.cell:hover{box-shadow:inset 0 0 0 max(2px,.7cqmin) var(--ink-2)}
.cell .pic{pointer-events:none}
.cover{position:absolute;inset:0;border-radius:50%;background:var(--pat),color-mix(in srgb,var(--c) 76%,transparent);box-shadow:inset 0 0 0 max(2px,.6cqmin) color-mix(in srgb,var(--c) 80%,#000);display:none;pointer-events:none}
.cell.on .cover{display:block}
.cell.nope{animation:nope .35s}
@keyframes nope{20%{transform:translateX(-5%)}40%{transform:translateX(5%)}60%{transform:translateX(-4%)}80%{transform:translateX(3%)}}
#done{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow),0 0 0 2px var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
#done b{font:600 20px var(--font-display)}

/* dialog */
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));height:min(86vh,820px);max-height:min(86vh,820px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(10,14,24,.55)}
.dlg-head{display:flex;align-items:center;gap:12px;padding:16px 18px 8px}
.dlg-head h2{font:600 22px var(--font-display);margin:0;margin-right:auto}
.dlg-tools{padding:6px 18px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1.5px solid var(--line)}
.dlg-tools input[type="search"]{flex:1 1 200px;min-width:0;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2)}
.dlg-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 18px;flex:1 1 auto;min-height:0}
.dlg-head,.dlg-tools{flex:none}
.letter{position:sticky;top:0;background:var(--surface);font:600 18px var(--font-display);color:var(--ink-2);padding:12px 0 6px;margin:0}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pick:hover{border-color:var(--ink-2);background:var(--surface-2)}
.pick .pic{width:56px;height:56px;background:var(--cell);border-radius:12px;padding:4px}
.pick span{font-size:14px;font-weight:700;text-align:center;overflow-wrap:anywhere;line-height:1.15}
.empty{color:var(--ink-2);padding:24px 0;text-align:center}

/* header actions: inline on large screens, a drop-down menu on small ones */
.sheet{display:flex;flex-direction:column;gap:12px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.menu-btn{display:none;width:44px;height:44px;padding:0;align-items:center;justify-content:center;flex:none}
.menu-btn svg,.dock-toggle svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sfx{display:inline-flex;align-items:center;gap:8px}
.sfx svg{width:20px;height:20px;flex:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
.sfx .body{fill:currentColor;stroke:none}
.sfx[aria-pressed="false"] .waves{display:none}
.sfx[aria-pressed="false"]{opacity:.7}

/* dock of piece buckets: small screens only */
.dock-bar{display:none;align-items:stretch;gap:8px}
.bucket{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 8px;min-height:58px;touch-action:none;user-select:none;-webkit-user-select:none}
.bucket .disc{width:42px;height:42px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 70%,#000);background:var(--pat),color-mix(in srgb,var(--c) 82%,transparent);color:var(--on-c);font:600 13px/1 var(--font-display);display:grid;place-items:center;flex:none}
.bucket .disc span{background:color-mix(in srgb,var(--c) 85%,transparent);border-radius:6px;padding:1px 3px}
.bucket .n{font:600 24px/1 var(--font-display);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:left}
.bucket[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.bucket.empty{opacity:.35;pointer-events:none}
.dock-toggle{flex:none;width:52px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;display:grid;place-items:center;padding:0}
.dock-toggle svg{transition:transform .2s}
#side.open .dock-toggle svg{transform:rotate(180deg)}
#grid[data-k] .cell.hot{box-shadow:inset 0 0 0 max(3px,1cqmin) var(--c)}
#play.dragging .sheet{opacity:.15;pointer-events:none}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (max-width:860px){ .top-grid,.cats{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){
  .card{padding:14px} .cat{padding:12px} .brand h1{font-size:22px} #setup .logo{width:40px;height:40px}
  .startbar .sum{width:100%;margin-right:0} .startbar .btn{width:100%}
  dialog{width:100vw;max-width:100vw;height:92vh;height:92dvh;max-height:92dvh;margin:auto 0 0 0;border-radius:20px 20px 0 0}
  .pics{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}
}

/* small screens: portrait phones and tablets, and landscape phones.
   The board is the main thing; controls hide in a menu; piece trays shrink to a dock of three buckets. */
@media (max-width:860px) and (orientation:portrait),(max-height:560px) and (orientation:landscape){
  #play .bar{padding-block:6px;gap:8px;flex-wrap:nowrap}
  #play .brand{gap:8px;min-width:0}
  #play .brand h2{display:none}
  #play .logo{width:32px;height:32px}
  #play .chips{gap:6px;flex-wrap:nowrap}
  #play .bar .chips .chip{font-size:14px;padding:4px 10px;min-width:2.6em}
  .menu-btn{display:inline-flex}
  .actions{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:40;flex-direction:column;align-items:stretch;gap:8px;
    background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow),0 0 0 1.5px var(--line);min-width:240px}
  .actions.open{display:flex}
  .actions .btn{width:100%;display:flex;align-items:center;gap:8px;min-height:44px}
  .actions .lang{justify-content:stretch}
  .actions .lang button{flex:1;min-height:40px}
  #stage{order:1} #side{order:2;overflow:visible;position:relative}
  .dock-bar{display:flex}
  .sheet{display:none;position:absolute;z-index:20;overflow:auto;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow),0 0 0 1.5px var(--line)}
  #side.open .sheet{display:flex}
  .sheet .pieces{display:none}
  .sheet .words{flex-direction:row;flex-wrap:wrap;gap:6px 14px}
  .sheet .tray{box-shadow:none;background:var(--surface-2);padding:10px}
}
@media (max-width:860px) and (orientation:portrait){
  .play{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px;padding-bottom:10px}
  .sheet{left:0;right:0;bottom:calc(100% + 8px);max-height:48dvh}
}
@media (max-height:560px) and (orientation:landscape){
  .play{grid-template-columns:minmax(0,1fr) 150px;grid-template-rows:minmax(0,1fr);gap:10px;padding-bottom:8px}
  #side{justify-content:center}
  .dock-bar{flex-direction:column;height:100%}
  .bucket{flex:1;min-height:0}
  .dock-toggle{width:auto;height:44px;flex:none}
  .dock-toggle svg{transform:rotate(-90deg)} #side.open .dock-toggle svg{transform:rotate(90deg)}
  .sheet{right:calc(100% + 10px);top:0;bottom:0;width:min(340px,60vw)}
}

function $(s,r){ return (r||document).querySelector(s); }
function el(tag, props){

    if(k==='class') n.className = v;

    else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2), v);
    else if(v===true) n.setAttribute(k,'');

  for(var i=2;i<arguments.length;i++){ var c = arguments[i]; if(Array.isArray(c)) c.forEach(function(x){ if(x) n.append(x); }); else if(c!=null && c!==false) n.append(c); }

/* ---------- building a board ---------- */
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function clashes(a,n){
  var c = 0;
  for(var i=0;i<a.length;i++){
    if((i%n)<n-1 && a[i].lib===a[i+1].lib) c++;
    if(i+n<a.length && a[i].lib===a[i+n].lib) c++;
  }
  return c;
}
function buildBoard(){
  var n = state.size, total = n*n;
  var usedPos = POS.filter(function(p){ return validItems(p).length>0; });
  var order = shuffle(usedPos.slice()), base = Math.floor(total/usedPos.length), extra = total-base*usedPos.length;
  var share = {}; order.forEach(function(p,i){ share[p] = base+(i<extra?1:0); });
  var cells = [];
  usedPos.forEach(function(p){
    var items = validItems(p);
    for(var i=0;i<share[p];i++){ var x = items[i%items.length]; cells.push({lib:x.lib, word:x.word, pos:p, key:p+':'+(i%items.length)}); }
  });
  shuffle(cells);
  var best = clashes(cells,n);
  for(var k=0;k<400 && best>0;k++){
    var a = Math.floor(Math.random()*total), b = Math.floor(Math.random()*total);
    var tmp = cells[a]; cells[a] = cells[b]; cells[b] = tmp;
    var c = clashes(cells,n);
    if(c<=best) best = c; else { tmp = cells[a]; cells[a] = cells[b]; cells[b] = tmp; }
  }
  var items = {}, totals = {};
  POS.forEach(function(p){ items[p] = validItems(p).slice(); totals[p] = share[p]||0; });
  game = {n:n, cells:cells, cover:cells.map(function(){return null;}), items:items, totals:totals, strict:state.strict, armed:null, nodes:[], trays:{}, buckets:{}, itemCells:{}, celebrated:{}, finaleDone:false};
  cells.forEach(function(c,i){ (game.itemCells[c.key] = game.itemCells[c.key]||[]).push(i); });
}

function renderGrid(){

/* ---------- sound (synthesised, no files) ---------- */
var AC = null;
function audio(){
  if(!state.sfx) return null;
  try{
    if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
    if(AC.state==='suspended') AC.resume();

  }catch(e){ return null; }
}
function tone(freq, start, dur, type, vol, dest){

  var o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime+start;
  o.type = type; o.frequency.setValueAtTime(freq, t0);

  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(dest||a.destination); o.start(t0); o.stop(t0+dur+0.05);
}
var NOTE = {initial:523.25, medial:659.25, final:783.99};
function chime(pos){
  if(!audio()) return;
  var f = NOTE[pos]||659.25;
  tone(f, 0, .35, 'sine', .16); tone(f*1.5, .09, .4, 'triangle', .1); tone(f*2, .18, .5, 'sine', .08);
}
function tick(){ if(!audio()) return; tone(880, 0, .07, 'sine', .05); }

  if(!audio()) return;
  var a = AC, len = Math.floor(a.sampleRate*.18), buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,3);
  var src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 900+Math.random()*1400; g.gain.value = (vol||1)*.22;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}
function fanfare(){
  if(!audio()) return;
  var a = AC, lp = a.createBiquadFilter(), master = a.createGain();
  lp.type = 'lowpass'; lp.frequency.value = 3200; master.gain.value = .7; lp.connect(master); master.connect(a.destination);
  // da-da-da DAAA, then a bright C-major chord
  var seq = [[523.25,0,.13],[523.25,.15,.13],[523.25,.3,.13],[698.46,.46,.42],[659.25,.92,.13],[783.99,1.08,.7]];
  seq.forEach(function(n){ tone(n[0],n[1],n[2]+.08,'sawtooth',.11,lp); tone(n[0]*2,n[1],n[2]+.05,'square',.03,lp); });
  [523.25,659.25,783.99,1046.5].forEach(function(f){ tone(f,1.08,1.1,'triangle',.07,lp); });
}

/* ---------- fireworks (canvas, category colours) ---------- */
var fx = $('#fx'), fctx = null, parts = [], raf = 0, fxTimers = [], dpr = 1;
function reduceMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function colorOf(pos){ return getComputedStyle(document.documentElement).getPropertyValue('--c-'+pos).trim() || '#f2813d'; }
function sizeFx(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  fx.width = Math.round(window.innerWidth*dpr); fx.height = Math.round(window.innerHeight*dpr);
}
function burst(x,y,color,count,speed){
  if(reduceMotion()) return;
  if(!fctx){ try{ fctx = fx.getContext('2d'); }catch(e){} if(!fctx) return; }
  if(fx.width !== Math.round(window.innerWidth*(Math.min(window.devicePixelRatio||1,2)))) sizeFx();
  for(var i=0;i<count;i++){
    var ang = Math.PI*2*i/count + Math.random()*.25, sp = speed*(.55+Math.random()*.6);
    parts.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:0,max:50+Math.random()*30,color:color,r:2+Math.random()*2});
  }

}
function stepFx(){
  raf = 0; if(!fctx) return;
  fctx.setTransform(1,0,0,1,0,0); fctx.clearRect(0,0,fx.width,fx.height);
  fctx.setTransform(dpr,0,0,dpr,0,0);
  parts = parts.filter(function(p){ return p.life<p.max; });
  parts.forEach(function(p){
    p.life++; p.vx*=.975; p.vy=p.vy*.975+.07; p.x+=p.vx; p.y+=p.vy;
    var k = 1-p.life/p.max;
    fctx.globalAlpha = Math.max(0,k); fctx.fillStyle = p.color;
    fctx.beginPath(); fctx.arc(p.x,p.y,p.r*(.4+k*.6),0,Math.PI*2); fctx.fill();
  });

}
function stopFx(){
  fxTimers.forEach(clearTimeout); fxTimers = []; parts = [];
  if(raf){ cancelAnimationFrame(raf); raf = 0; }
  if(fctx) fctx.clearRect(0,0,fx.width,fx.height);
}
function finale(){
  fanfare();
  var cols = POS.map(colorOf).concat(['#ffd23f','#ffffff']), W = window.innerWidth, H = window.innerHeight;
  for(var i=0;i<14;i++) (function(i){
    fxTimers.push(setTimeout(function(){
      burst(W*(.12+Math.random()*.76), H*(.15+Math.random()*.4), cols[i%cols.length], 60, 5.5+Math.random()*2);
      pop(1);
    }, 150+i*260+Math.random()*120));
  })(i);
}
window.addEventListener('resize', function(){ if(fctx) sizeFx(); });

load(); applyStatic(); renderSetup();
})();
